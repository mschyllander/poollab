server {
    listen 8010;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /update/ {
        alias /usr/share/nginx/html/update/;
        autoindex on;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8011;
        proxy_http_version 1.1;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8011/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    location /mcu/api/ {
        proxy_pass http://192.168.1.68/api/;
        proxy_http_version 1.1;
    }

    location = /mcu/pair {
        proxy_pass http://192.168.1.68/pair;
        proxy_http_version 1.1;
    }

    location = /mcu/clear {
        proxy_pass http://192.168.1.68/clear;
        proxy_http_version 1.1;
    }

    location /mcu/ws {
        proxy_pass http://192.168.1.68/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
